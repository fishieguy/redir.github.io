<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<title>Redirector</title>
<script>
document.addEventListener('DOMContentLoaded', function () {
  // take first path segment after the repo root, e.g. /roblox.com -> "roblox.com"
  var seg = window.location.pathname.replace(/^\/+|\/+$/g, '').split('/')[0] || '';
  if (!seg) {
    document.body.textContent = 'No target provided.';
    return;
  }

  // if the segment already looks like a full URL with scheme, use it as-is,
  // otherwise prepend https:// (this avoids relative-site 404 behavior)
  var hasScheme = /^[a-zA-Z][a-zA-Z0-9+.-]*:\/\//.test(seg);
  var target = hasScheme ? seg : ('https://' + seg);

  // immediate navigation (replace avoids leaving redirect page in history)
  window.location.replace(target);

  // visible fallback if automatic redirect is blocked
  setTimeout(function () {
    document.body.innerHTML = 'If nothing happened, click to open: <a href="' + target + '" rel="noopener noreferrer" target="_blank">' + target + '</a>';
  }, 600);
});
</script>
</head>
<body></body>
</html>
